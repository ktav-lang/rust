name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # README.md/.ru.md/.zh.md are generated by @ktav-lang/polydoc from the
  # root-docs/ unit trees. This job fails when a committed artifact drifts
  # from its source — which is what a hand-edit of the artifact looks
  # like. Fix the source and re-run the generator; never patch the
  # artifact.
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # docs.rs builds with --all-features; this is what caught the
      # broken-intra-doc-link regressions the generated-markdown check
      # above cannot see, since that check never touches rustdoc.
      - name: Build API documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features

  msrv:
    name: MSRV (1.71)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Stable cargo (>= 1.84) with `incompatible-rust-versions = fallback`
      # honours `package.rust-version` and prefers transitive versions
      # declaring MSRV <= ours, so the graph stays buildable on the
      # toolchain pinned below without per-crate `--precise` pins.
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate MSRV-aware lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile

      # tests/cabi_load.rs spawns a SEPARATE `cargo build` for the fixture
      # cdylib, so the fixture has its own dependency graph and its own
      # lockfile — neither of which the step above touches. That nested
      # build runs under the pinned toolchain below, whose resolver has no
      # MSRV awareness at all, so without this step it resolves
      # newest-compatible and pulls in a crate requiring a newer edition.
      # Both lockfiles are gitignored, so both are generated here.
      - name: Generate MSRV-aware lockfile for the cabi fixture
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile --manifest-path tests/cabi-fixture/Cargo.toml

      - uses: dtolnay/rust-toolchain@1.71

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --all-features
