name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

  msrv:
    name: MSRV (1.70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Stable cargo (>= 1.84) with `incompatible-rust-versions = fallback`
      # honours `package.rust-version` and prefers transitive versions
      # declaring MSRV <= ours — it still does the bulk of the work here
      # (e.g. it holds `zmij` at 1.0.19 because 1.0.23 wants 1.71).
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate MSRV-aware lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile

      # The fallback resolver filters on each crate's *own* rust-version,
      # so it cannot see an MSRV bump that arrives through an exact
      # companion pin: `serde_core 1.0.229` declares rust-version 1.56
      # (accepted), yet requires `serde_derive = "=1.0.229"`, which
      # declares 1.71 (2026-07-18) and breaks the build. serde,
      # serde_core and serde_derive move in lockstep, so pinning `serde`
      # walks all three back to 1.0.228 (rust-version 1.61).
      - name: Pin dependencies that outgrew our MSRV
        run: cargo update -p serde --precise 1.0.228

      - uses: dtolnay/rust-toolchain@1.70

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked
