name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # README.md/.ru.md/.zh.md are generated by tools/docs-gen from the
  # documents declared in docs.config.mjs. This job fails when a committed
  # artifact drifts from its source — which is what a hand-edit of the
  # artifact looks like. Fix the source and re-run the generator; never
  # patch the artifact.
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generated docs are byte-identical to their source units
        run: node tools/docs-gen/src/cli.mjs --check

      - name: docs-gen's own tests
        run: node --test ./tools/docs-gen/test/docs-gen.test.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

  msrv:
    name: MSRV (1.71)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Stable cargo (>= 1.84) with `incompatible-rust-versions = fallback`
      # honours `package.rust-version` and prefers transitive versions
      # declaring MSRV <= ours, so the graph stays buildable on the
      # toolchain pinned below without per-crate `--precise` pins.
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate MSRV-aware lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile

      - uses: dtolnay/rust-toolchain@1.71

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked
