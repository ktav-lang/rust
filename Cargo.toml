[package]
name = "ktav"
version = "0.8.0"
edition = "2021"
description = "Ktav — a plain configuration format. Three rules, zero indentation, zero quoting. Serde-native."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktav-lang/rust"
readme = "README.md"
keywords = ["config", "configuration", "serde", "minimal", "plain"]
categories = ["config", "parsing"]
rust-version = "1.71"

# Development-only material, kept out of the published tarball: the spec
# conformance corpus vendored as the `spec/` submodule (~1,470 fixture
# files, 97% of the package by size), internal review notes and session
# checkpoints, the markdown generator, and CI configuration. `cargo add
# ktav` should download the library, not the whole specification
# repository. The integration tests stay in the package: they are small,
# and dropping them makes Cargo warn once per auto-discovered test target
# on every publish. `spec_conformance` is the only one that needs the
# excluded corpus; run the suite from a git checkout, where nothing is
# excluded.
#
# `/tests/cabi-fixture/` is a separate crate that path-depends on this
# one, which `cargo package` cannot ship.
exclude = [
    "/.github/",
    "/docs/",
    "/docs.config.mjs",
    "/spec/",
    "/tests/cabi-fixture/",
    "/tools/",
]

# Which version of the Ktav format specification this crate implements.
# See https://github.com/ktav-lang/spec for the formal document.
[package.metadata.ktav]
spec-version = "0.8.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Built only when the `cabi` feature is on. `preserve_order` keeps JSON
# object key order stable on the ABI wire; `arbitrary_precision` keeps
# integers beyond 64 bits lossless. The dev-dependency entry below stays:
# the test suite needs serde_json regardless of the feature.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"], optional = true }
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
itoa = "1"
ryu = "1"
compact_str = { version = "0.9", features = ["serde"] }
bumpalo = { version = "3", features = ["collections"] }
memchr = "2"

[features]
# The `ktav-fmt` binary. Off by default on purpose: this repository
# publishes to crates.io only and attaches no prebuilt binaries, so an
# unconditional bin target would commit the default install surface to a
# tool reachable solely by people who already have a Rust toolchain —
# while every binding exposes the same formatter natively and editors go
# through `ktav-lsp`. Enabling it is one flag:
#   cargo install ktav --features cli
cli = []

# The C ABI support surface for the language bindings: the `ktav::cabi`
# module and the `declare_cabi!` macro. Off by default — a default build
# of this crate must not pull serde_json at all.
cabi = ["dep:serde_json"]

[[bin]]
name = "ktav-fmt"
path = "src/bin/ktav-fmt.rs"
required-features = ["cli"]

[lib]
doctest = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
criterion = { version = "0.5", features = ["html_reports"] }
libloading = "0.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "vs_json"
harness = false

[[bench]]
name = "format"
harness = false
